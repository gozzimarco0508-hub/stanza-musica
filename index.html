
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La stanza della musica</title>
<style>
body {
  margin: 0;
  padding: 16px;
  background: #f1e8da;
  font-family: Arial, sans-serif;
  color: #352719;
}
.player {
  max-width: 480px;
  margin: auto;
  padding: 22px;
  background: #fffaf2;
  border-radius: 18px;
  box-shadow: 0 4px 16px #0002;
}
h2 { text-align: center; margin-top: 0; }
.subtitle {
  text-align: center;
  color: #80694f;
  margin-bottom: 22px;
}
audio { width: 100%; margin: 12px 0; }
button {
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  margin: 4px;
  background: #70543b;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
.controls { text-align: center; }
ol { padding-left: 28px; }
li {
  padding: 10px 6px;
  cursor: pointer;
  border-bottom: 1px solid #e7dccd;
}
li:hover { background: #eee1cf; }
li.active { font-weight: bold; color: #8b4c19; }
.note {
  font-size: 12px;
  color: #80694f;
  text-align: center;
}
</style>
</head>
<body>
<div class="player">
  <h2>La stanza della musica</h2>
  <div class="subtitle">Siediti, scegli, ascolta 🎵</div>

  <div id="now">Scegli una canzone</div>
  <audio id="audio" controls preload="none"></audio>

  <div class="controls">
    <button id="prev">⏮ Precedente</button>
    <button id="next">Successiva ⏭</button>
  </div>

  <h3>La mia playlist</h3>
  <ol id="playlist"></ol>
  <p class="note">Seleziona un brano dall'elenco per ascoltarlo.</p>
</div>

<script>
const brani = [
  { titolo: "La cura", file: "La cura.mp3" },
  { titolo: "04 Corner Of The Earth", file: "04 Corner Of The Earth.mp3" },
  { titolo: "Man in the Mirror", file: "Man in the Mirror.mp3" }
];
const audio = document.getElementById("audio");
const elenco = document.getElementById("playlist");
const nome = document.getElementById("now");
let corrente = 0;

function mostraPlaylist() {
  elenco.innerHTML = "";
  brani.forEach((brano, indice) => {
    const voce = document.createElement("li");
    voce.textContent = brano.titolo;
    voce.onclick = () => riproduci(indice);
    elenco.appendChild(voce);
  });
}

function riproduci(indice) {
  corrente = (indice + brani.length) % brani.length;
  audio.src = brani[corrente].file;
  nome.textContent = brani[corrente].titolo;
  [...elenco.children].forEach((voce, i) => {
    voce.classList.toggle("active", i === corrente);
  });
  audio.play().catch(() => {
    nome.textContent =
      brani[corrente].titolo +
      " — aggiungeremo il file MP3 in seguito";
  });
}

document.getElementById("prev").onclick =
  () => riproduci(corrente - 1);
document.getElementById("next").onclick =
  () => riproduci(corrente + 1);

audio.addEventListener("ended", () => {
  riproduci(corrente + 1);
});

mostraPlaylist();
</script>
</body>
</html>
